# Copy to config.yaml on each machine.

# Optional: your paper repo's plotting/ folder (must contain or receive nature_style.py).
# Leave empty ("") to use bundled skills/nature-plotting/assets only — works for any clone.
canonical_plotting_dir: ""

agents:
  cursor: true
  claude: true
  codex: true
  agents: false

# When canonical_plotting_dir is set, copy assets/nature_style.py there on install.
sync_nature_style_to_plotting_dir: true
